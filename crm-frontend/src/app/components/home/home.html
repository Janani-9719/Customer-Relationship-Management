<div class="container">
    <table class="table">
        <thead class="thead-dark">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">First Name</th>
                <th scope="col">Last Name</th>
                <th scope="col">Email</th>
                <th scope="col">Phone Number</th>
                <th scope="col">Address</th>
                <th scope="col">City</th>
                <th scope="col">State</th>
                <th scope="col">Country</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let customer of customers">
                <th scope="row">{{ customer.id }}</th>
                <td>{{ customer.firstName }}</td>
                <td>{{ customer.lastName }}</td>
                <td>{{ customer.email }}</td>
                <td>{{ customer.phoneNumber }}</td>
                <td>{{ customer.address }}</td>
                <td>{{ customer.city }}</td>
                <td>{{ customer.state }}</td>
                <td>{{ customer.country }}</td>
                <td>
                    <button type="button" class="btn btn-warning action-btn" data-bs-toggle="modal" data-bs-target="#editModal" (click)="selectedCustomer = customer">Update</button>
                    <button type="button" class="btn btn-danger action-btn" (click)="deleteCustomer(customer.id)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<app-customer-modal [customer]="selectedCustomer" (updateCustomer)="updateCustomer($event)"></app-customer-modal>
