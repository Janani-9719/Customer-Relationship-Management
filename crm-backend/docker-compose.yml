version: "3.9"
services:
  oracle:
    image: gvenzl/oracle-free:23.5-slim
    container_name: oracle-free
    ports:
      - "1521:1521"   # DB listener
      - "5500:5500"   # EM Express (optional)
    environment:
      ORACLE_PASSWORD: admin_pw
      APP_USER: crm
      APP_USER_PASSWORD: crm_pw
      ORACLE_DATABASE: FREEPDB1
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - oracle_data:/opt/oracle/oradata
volumes:
  oracle_data: